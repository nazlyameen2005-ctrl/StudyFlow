<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="style.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color:#F2EFE9;
            color: rgb(170, 165, 10);
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 10px;
           
        }

        .timer {
            display: inline-block;
            padding: 10px;
            width: 600px;
            box-sizing: border-box;
        }

        main {
            width: 25rem;
            height: 25rem;
            border-radius: 50%;
            text-align: center;
            margin: auto 0;
            margin-bottom: 2rem;
           
        }

        h1 {
            font-size: 2rem;
            margin: 20px auto;
        }

        .border {
            margin: 10px auto;
            align-content: center;
            max-width: 700px;
            max-height: 1000px;
            box-sizing: border-box;
            border-radius: 20%;
            border: 10px solid  rgb(170, 165, 10);
            background-color:   #231919;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;


        }

        .pomodoro {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            margin: 4px 0;
            text-align: center;
            border-radius: 50%;
            background-color:#FAF6F0;
            margin: 100px;
            border: 10px solid  rgb(170, 165, 10);
        }

        .timer {
            font-size: 5rem;
            margin: 20px auto;
        }

        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .button {
            background-color: #4e0f0f;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    
        
        .button.active, .button:hover {
            background-color:  #846b1c;
            
        }

        .timerdisplay {
            font-size: 5rem;
            margin-top: 20px;
            font-weight: bold;
        }

        .time {
            font-size: 100%;
        }

        #start, #stop {
            background-color:  #4e0f0f;
            color: #ffe8ee;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            border: none;
        }

        #start {
            margin-left: 30px;
        }

        #stop:hover {
             background-color: rgb(132, 3, 3);

        }
         #start:hover {
            background-color: rgb(15, 104, 76);

        }



    </style>
</head>

     <header class="site-header">
            <div class="container header-inner">
                <a class="brand" href="dashboard.html">
                    <span class="brand-mark"><img class="logo" src="images/logo backgroud removed.gif"></span>
                    <span>RUHUNA<small>Study Flow</small></span>
                </a>

		
                
            <nav class="main-nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="features.html">Features</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </nav>
                
            </div>
    </header>

    <body>

        <div class="border">
            <div class="container">
                <div class="timer">
                    <h1>Pomodoro Timer</h1>

                    <div class="button-container">
                        <button class="button" id="pomodoro-session">Pomodoro</button>
                        <button class="button" id="shortbrk">Short</button>
                        <button class="button" id="longbrk">Long</button>
                    </div>

                    <main>
                        <div class="pomodoro">

                            <div id="pomodorotimer" class="timerdisplay" data-duration="25.00">
                                <h1 class="time">25.00</h1>
                            </div>

                            <div id="shorttime" class="timerdisplay" data-duration="5.00">
                                <h1 class="time">5.00</h1>
                            </div>

                            <div id="longtime" class="timerdisplay" data-duration="10.00">
                                <h1 class="time">10.00</h1>
                            </div>


                        </div>
                    </main>

                    <div class="buttons">
                        <button id="start">START</button>
                        <button id="stop">STOP</button>
                    </div>
                </div>
            </div>
        </div>
    <script>

           let pomodoro = document.getElementById("pomodorotimer");
           let short = document.getElementById("shorttime");
           let long = document.getElementById("longtime"); 
           let timers = document.querySelectorAll(".timerdisplay");
           let session = document.getElementById("pomodoro-session");
           let shortbreak = document.getElementById("shortbrk");
           let longbreak = document.getElementById("longbrk");
           let stopbtn = document.getElementById("stop");
           let startbtn = document.getElementById("start");
           let button = document.getElementById(".button");
        
           let currentTimer = pomodoro; //// set default pomodoro so "Start" works on load
           let myIntervel = null;

           // The defult timer

           function showDefultTimer() {
                pomodoro.style.display = "block"
                short.style.display = "none"
                long.style.display = "none"

           }

           showDefultTimer()

           function hideAll() {
                timers.forEach((timer)=> {
                    timer.style.display = "none"
            })
           }

           session.addEventListener("click", () => {
                hideAll()

                pomodoro.style.display = "block"

                session.classList.add("active")
                shortbreak.classList.remove("active")
                longbreak.classList.remove("active")

                currentTimer = pomodoro;
                
           })

            shortbreak.addEventListener("click", () => {
                hideAll()

                short.style.display = "block"

                session.classList.remove("active")
                shortbreak.classList.add("active")
                longbreak.classList.remove("active")

                currentTimer = short;
                
           })

            longbreak.addEventListener("click", () => {
                hideAll()

                long.style.display = "block"

                session.classList.remove("active")
                shortbreak.classList.remove("active")
                longbreak.classList.add("active")

                currentTimer = long;
                
           })

           //start timer when click

           function startTimer(timerdisplay){
                if(myIntervel) {
                    clearInterval(myIntervel)

                }

                timerDuration = timerdisplay.getAttribute("data-duration").split(":")[0]

                let durationInMilliseconds = timerDuration * 60 * 1000
                let endTimestamp = Date.now() + durationInMilliseconds

                myIntervel = setInterval(() => {
                    const timeRemaining = new Date(endTimestamp - Date.now())
                    
                    if(timeRemaining <= 0) {
                        clearInterval(myIntervel)
                        timerdisplay.textContent = "00:00"

                        const alarm = new Audio("https://www.freespecialeffects.co.uk/soundfx/scifi/electronic.wav")
                        alarm.play()
                    
                    } else {
                        const minutes = Math.floor(timeRemaining/60000)
                        const seconds = ((timeRemaining % 60000) / 1000).toFixed(0)
                        const formattedTime = `${minutes}:${seconds
                            .toString()
                            .padStart(2,"0")}`;
                        timerdisplay.textContent = formattedTime   
                    }
                }, 1000)
            }
                

                startbtn.addEventListener("click", ()=>{
                    if(currentTimer) {
                        startTimer(currentTimer)
                        
                    }
                })

                stopbtn.addEventListener("click", ()=>{
                        if(currentTimer) {
                            clearInterval(myIntervel)
                        }
                })
    </script>

                        <span class="brand-mark"><img class="logo" src="images/logo backgroud removed.gif"></span>
                        <span>RUHUNA <small>Study Flow</small></span>

                    <p> Group 8 - University of Ruhuna</p>
                    <p> 2026 Ruhuna Study flow</p>
                </div>
        </footer>
    </body>       

</html>
